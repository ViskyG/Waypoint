<!doctype html>
<html lang="en" data-theme="terracotta">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="shell.title">Waypoint · Work map</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header class="top"><div class="brand"><b class="mark">W</b><strong>WAYPOINT</strong></div><button id="home" data-i18n="shell.projects">Projects</button><span class="project-title">Projects</span><select id="project" aria-label="Project" data-i18n-aria-label="shell.project"></select><span id="connection" class="pill" data-i18n="shell.local">Local</span><select id="theme" aria-label="Theme" data-i18n-aria-label="shell.theme"></select><select id="language" aria-label="Interface language" data-i18n-aria-label="shell.language"><option value="en">English</option><option value="ru">Русский</option></select></header>
<section class="agents-bar"><div class="rail-title"><span data-i18n="shell.agents">AGENTS</span> <span id="active-count"></span></div><div id="agents" class="agent-strip"></div></section>
<main><aside class="orchestrators"><div class="section-label" data-i18n="shell.orchestrators">ORCHESTRATORS</div><div id="orchestrators"></div><button id="outside" class="outside"><span data-i18n="shell.outside">Outside map</span> <span id="outside-count">0</span></button><div class="rail-footer" data-i18n="shell.observer">Observation, no agent control</div></aside>
<section class="workspace">
<div class="toolbar"><nav id="project-views" aria-label="Project view" data-i18n-aria-label="shell.view"><button data-view="map" data-i18n="shell.map">Map</button><button data-view="plan" data-i18n="shell.plan">Plan</button><button data-view="algorithms" data-i18n="shell.algorithms">Algorithms</button></nav><div id="crumbs" class="crumbs"></div><button id="up" title="Go up one level" aria-label="Go up one level" data-i18n-title="shell.up" data-i18n-aria-label="shell.up">↑</button><div class="toolbar-end"><input id="search" placeholder="Find a block…" aria-label="Find a block" data-i18n-placeholder="shell.search" data-i18n-aria-label="shell.searchLabel"><select id="version" aria-label="Plan version" data-i18n-aria-label="shell.version"></select><button id="diff" title="Plan changes" data-i18n-title="shell.diff">Δ</button><button id="fit" title="Fit map" data-i18n-title="shell.fit">⛶</button><button id="minus" aria-label="Zoom out" data-i18n-aria-label="shell.zoomOut">−</button><button id="zoom" title="Reset zoom to 100%" data-i18n-title="shell.resetZoom">100%</button><button id="plus" aria-label="Zoom in" data-i18n-aria-label="shell.zoomIn">+</button><button id="full" title="Full screen" data-i18n-title="shell.full">↗</button></div></div>
<section id="projects-view" class="content-view" hidden></section><section id="plan-view" class="content-view" hidden></section><section id="algorithms-view" class="content-view" hidden></section>
<div id="viewport" class="viewport" tabindex="0" aria-label="Work graph. Drag empty space to pan; use the wheel to zoom." data-i18n-aria-label="shell.graph"><div id="world"><svg id="edges" aria-label="Dependencies" data-i18n-aria-label="shell.dependencies"></svg><div id="nodes"></div></div><div id="empty"></div><div id="map-note" class="map-note"></div></div>
<aside id="inspector" class="inspector" hidden><header><div><span id="inspector-id"></span><h2 id="inspector-title"></h2></div><button id="close" aria-label="Close details" data-i18n-aria-label="shell.close">×</button></header><nav id="tabs"></nav><div id="inspector-body"></div></aside>
</section></main>
<footer><span id="foot-status" data-i18n="shell.waiting">Waiting for local service</span><span id="summary"></span><button id="reset-selection" data-i18n="shell.clear" hidden>Clear selection</button><span class="muted" data-i18n="shell.wheel">Wheel · zoom / chat</span></footer>
<div id="notice" role="status" hidden></div>
<script src="/static/i18n.js" defer></script>
<script src="/static/themes.js" defer></script>
<script src="/static/projects.js" defer></script>
<script src="/static/plan.js" defer></script>
<script src="/static/filters.js" defer></script>
<script src="/static/algorithm_panel.js" defer></script>
<script src="/static/app.js" defer></script>
</body></html>
