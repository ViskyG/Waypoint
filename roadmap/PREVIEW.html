нтов."}, "A-02": {"text": "Источник не получает команды запуска/остановки/resume/approval; сбой Waypoint не останавливает Codex."}, "A-03": {"text": "Старые и неоднозначные сообщения не присваиваются новому focus; подтверждение ревизии не опережает durable commit."}, "A-04": {"text": "C06 получает индексированный и совместимый read-контракт; ограничения живой проверки явно возвращены."}}, "assignment": "Довести существующий адаптер до проверенного приёма живых событий и точного связывания с блоками. IPC и JSONL остаются входами одного Store/API/UI.\n\nРабота:\n1. Выполнить C05.1–C05.4, сохраняя исходные алгоритмы дизайна: verified caller binding, watermark, indexed normalization, coalescing и durable acknowledgement.\n2. Единолично владеть изменениями Store/API/миграции, включая индекс item_targets для C06. Передать потребителю проверенный read-контракт; не позволять двум веткам менять store.py одновременно.\n3. Проверить свой новый адаптер на естественной активности существующего Codex, а не повторять весь P00–P11 и не запускать новый App Server вместо владельца.\n\nОбласть изменений: waypoint/adapters/; waypoint/collector.py; waypoint/store.py (единственный писатель); waypoint/server.py (только необходимый совместимый read-контракт); waypoint/cli.py (только verified binding seam); tests/test_adapters.py; tests/test_core.py (атрибуция/индекс/миграция).\n\nНе изменять: waypoint/web/; tests/browser_check.py; Глобальные настройки и управление реальным Codex.\n\nТочное чтение (пути от roadmap/):\n../waypoint/design/WORK_PACKETS.md — раздел WPT-C05\n../waypoint/design/IMPLEMENTATION_MAP.md — раздел Required hardening\n../waypoint/design/CONTRACTS.md — раздел 1. Identity; 4. Observation; 5. Attribution; 7. Private IPC\n../waypoint/design/ACCEPTANCE.md — раздел Target sequence\n\nРежим MIXED. Предпочтительный исполнитель: CODEX. Исполнитель выбирает безопасный порядок внутри согласованного участка; назначение не сделано.\n\nОстановить только затронутое действие и эскалировать: профиль несовместим или неизвестна идентичность вызывающего агента; сохранить доказательство, не угадывать и не строить второй observer.\n\nПри ожидании: пока естественное событие не пришло — локальные контрактные проверки C05.2/C05.3; C06.1/C06.2 могут идти независимо.", "layout": {"x": 1220, "y": 100}, "parent": null, "source_refs": [{"label": "design/WORK_PACKETS.md", "section": "WPT-C05", "uri": "../waypoint/design/WORK_PACKETS.md"}, {"label": "design/IMPLEMENTATION_MAP.md", "section": "Required hardening", "uri": "../waypoint/design/IMPLEMENTATION_MAP.md"}, {"label": "design/CONTRACTS.md", "section": "1. Identity; 4. Observation; 5. Attribution; 7. Private IPC", "uri": "../waypoint/design/CONTRACTS.md"}, {"label": "design/ACCEPTANCE.md", "section": "Target sequence", "uri": "../waypoint/design/ACCEPTANCE.md"}], "tests": {"T-01": {"evidence_level": "contract + target", "invalidated_by": "Binding, watermark, merge источников, schema metadata.", "label": "Идентичность и атрибуция", "procedure": "Фокус до/после hydration, straddling item, одинаковый session_id у разных payload.id. Сверка исторического и живого источника без выдачи fixtures за live."}, "T-02": {"evidence_level": "component", "invalidated_by": "Normalizer, patch parser, store transaction, cursor или coalescing.", "label": "Поток и приём в БД", "procedure": "Повтор/пропуск/конфликт revision, отказ sink, reconnect и terminal flush; receipt после транзакции."}, "T-03": {"evidence_level": "live target", "invalidated_by": "Версия расширения, профиль IPC, runtime config или адаптер.", "label": "Целевая естественная активность", "procedure": "Одна или несколько реальных операций совпадают по ID/типу/тексту локально; в отчёте только безопасные равенства и типы."}}, "title": "Живой источник и точные привязки", "x_roadmap": {"avoid_paths": ["waypoint/web/", "tests/browser_check.py", "Глобальные настройки и управление реальным Codex"], "eligible_alternative": null, "escalation": "профиль несовместим или н ать C06 контракт и fixture; не ждать окончания всей C05 ради независимой UI-подготовки.", "source_capsule": "WPT-C05", "wave": null}}, "WPT-C05.4": {"acceptance": {"A-01": {"text": "Совпадение сообщения/действия подтверждено на новой реализации без пересказа и новых turns ради счётчика."}, "A-02": {"text": "Ни одна отправленная команда не управляет исполнителем; закрытие Waypoint не завершает детей."}, "A-03": {"text": "Непроверенные жизненные циклы явно названы; в возврате нет реальных текстов/секретов."}}, "assignment": "Проверить не старые пробы, а текущую реализацию на существующей выбранной сессии.\n\nРабота:\n1. Соединиться с тем же фактическим owner IPC; установить allowlist и закрыть свои подписки после опыта. Историю читать только в выбранном семействе.\n2. Локально сравнить доступный native message/tool и результат карты. Различить активного родителя и исторических потомков; не выдавать прошлое дерево за одновременный live-run.\n3. Прервать только observer/свой socket и проверить продолжение Codex, health, resync и восстановление receipt. Зафиксировать payload sizes и реально измеренную задержку с n.\n\nОбласть изменений: Тесты нового адаптера; Приватные диагностики и безопасный отчёт C05.\n\nНе изменять: Чужие процессы и их execution state.\n\nТочное чтение (пути от roadmap/):\n../waypoint/design/ACCEPTANCE.md — раздел Target sequence\n../waypoint/design/OPERATIONS.md — раздел Remaining target acceptance\n../waypoint/sources/feasibility-evidence-v3.zip\n\nРежим MIXED. Предпочтительный исполнитель: CODEX. Исполнитель выбирает безопасный порядок внутри согласованного участка; назначение не сделано.\n\nОстановить только затронутое действие и эскалировать: нужный реальный случай не возник: NOT_RUN для этого утверждения; запросить узкий опыт только если он нужен для обещаемой возможности.", "layout": {"x": 1160, "y": 650}, "parent": "WPT-C05", "source_refs": [{"label": "design/ACCEPTANCE.md", "section": "Target sequence", "uri": "../waypoint/design/ACCEPTANCE.     $('#search').addEventListener('keydown', e => { if (e.key !== 'Enter')

    function closeInspector() { if (ui.inspector?.reader) detachReader(ui.inspector.reader); $('#inspector').hidden = true; ui.inspector = null; }

    function inspectorSignature(kind, id, tab) {

    function refreshInspectorDetails() {

            const a = ui.state.agents.find(a => a.id === id);

        body.append(btn('Копировать адрес блока', async () => { const link = location.origin + location.pathname + '#project=' + encodeURIComponent(ui.project) + '&scope=' + encodeURIComponent(node.parent || '') + '&node=' + encodeURIComponent(id); try {

    $('#diff').onclick = async () => { const index = ui.versions.findIndex(v => v.version === ui.state.version), previous = ui.versions[index + 1]; if (!previous)
        return notice('Предыдущей версии нет'); openInspector('diff', null, 'diff'); $('#inspector-title').textContent = 'Изменения плана'; const body = $('#inspector-body'); body.replaceChildren(); try {

    function objectDiff(a, b, path = []) { if (JSON.stringify(a) === JSON.stringify(b))

    $('#version').onchange = async (e) => { ui.version = e.target.value; await refresh(true); };
    $('#project').onchange = async (e) => { closeInspector(); for (const reader of readers.values()) detachReader(reader); readers.clear(); $('#nodes').replaceChildren(); ui.project = e.target.value; ui.cursor = 0; ui.version = null; ui.scope = null; ui.camera = { x: 60, y: 35, z: .82 }; await refresh(true); };
    async function refresh(includeVersions = false, events = null) { if (ui.busy)
        return; ui.busy = true; try {

    async function watch() { while (!stopped && !demo) {

    async function boot() { try {
