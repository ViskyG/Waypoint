tity; 4. Observation; 5. Attribution; 7. Private IPC", "uri": "../waypoint/design/CONTRACTS.md"}, {"label": "design/ACCEPTANCE.md", "section": "Target sequence", "uri": "../waypoint/design/ACCEPTANCE.md"}], "safe_alternate_work": "пока естественное событие не пришло — локальные контрактные проверки C05.2/C05.3; C06.1/C06.2 могут идти независимо.", "source_capsule": "WPT-C05", "wave": "RW-01"}}, "WPT-C05.1": {"acceptance": {"A-01": {"text": "Разные payload.id с одним session_id остаются разными агентами."}, "A-02": {"text": "Две области и ребро могут быть связаны с одним исполнителем; область может быть общей."}, "A-03": {"text": "Старое сообщение не получает текущий focus после позднего импорта; исправление item.link сохраняет историю."}}, "assignment": "Связать редкий focus-сигнал с настоящим отдельным исполнителем и границей уже наблюдённых сообщений.\n\nРабота:\n1. Использовать payload.id, parent_thread_id, agent_path и forked_from_id по отдельности. Сопоставить native caller в текущем клиенте; не наследовать WP_AGENT родителя вслепую.\n2. Зафиксировать committed revision/item watermark при scope.set. Уже связанные items сохраняют цель; историческая hydration и неоднозначное пересечение focus остаются непривязанными до явного item.link.\n3. Сохранить node/edge many-to-many, пустой scope и неизвестные block ID как допустимые наблюдения; нельзя превращать focus в эксклюзивный lock.\n\nОбласть изменений: waypoint/cli.py (привязка); waypoint/collector.py (source boundary); waypoint/store.py (атрибуция); tests/test_core.py.\n\nНе изменять: web assets.\n\nТочное чтение (пути от roadmap/):\n../waypoint/design/IMPLEMENTATION_MAP.md — раздел Required hardening\n../waypoint/design/CONTRACTS.md — раздел 5. Attribution\n../waypoint/waypoint/cli.py\n../waypoint/waypoint/store.py\n../waypoint/tests/test_core.py\n\nРежим MIXED. Предпочтительный исполнитель: CODEX. Исполнитель выбирает безопасный порядок внутри согласованного участка; назначение не сделано.\n\nПри ожидании: продолжить локальную проверку атрибуции; неизвестный caller не маскировать удобным ID.", "layout": {"x": 80, "y": 80}, "parent": "WPT-C05", "source_refs": [{"label": "design/IMPLEMENTATION_MAP.md", "section": "Required hardening", "uri": "../waypoint/design/IMPLEMENTATION_MAP.md"}, {"label": "design/CONTRACTS.md", "section": "5. Attribution", "uri": "../waypoint/design/CONTRACTS.md"}, {"label": "waypoint/cli.py", "uri": "../waypoint/waypoint/cli.py"}, {"label": "waypoint/store.py", "uri": "../waypoint/waypoint/store.py"}, {"label": "tests/test_core.py", "uri": "../waypoint/tests/test_core.py"}], "tests": {"T-01": {"evidence_level": "contract", "invalidated_by": "cli binding, scope projection, native watermark.", "label": "Граничные сообщения", "procedure": "Добавить к существующим focus/historical тестам подтверждённый watermark, поздний сигнал и неоднозначную границу."}}, "title": "Исполнитель и граница рабочего участка", "x_observability": {"intent": {"change": "Сопоставлять собственную идентичность исполнителя с явной границей его рабочего участка.", "context": "Родительский процесс и подагент могут работать одновременно в разных блоках.", "summary": "Определять исполнителя и участок работы"}}, "x_roadmap": {"avoid_paths": ["web assets"], "eligible_alternative": null, "escalation": "", "kind": "stage", "owned_paths": ["waypoint/cli.py (привязка)", "waypoint/collector.py (source boundary)", "waypoint/store.py (атрибуция)", "tests/test_core.py"], "preferred_executor": "CODEX", "read_set": [{"label": "design/IMPLEMENTATION_MAP.md", "section": "Required hardening", "uri": "../waypoint/design/IMPLEMENTATION_MAP.md"}, {"label": "design/CONTRACTS.md", "section": "5. Attribution", "uri": "../waypoint/design/CONTRACTS.md"}, {"label": "waypoint/cli.py", "uri": "../waypoint/waypoint/cli.py"}, {"label": "waypoint/store.py", "uri": "../waypoint/waypoint/store.py"}, {"label": "tests/test_core.py", "uri": "../waypoint/tests/test_core.py"}], "safe_alternate_work": "продолжить локальную проверку атрибуции; неизвестный caller не маскировать удобным ID.", "source_capsule": "WPT-C05", "wave": null}}, "WPT-C05.2": {"acceptance": {"A-01": {"text": "Один patch одного item не вызывает обход всей истории в нормальном случае."}, "A-02": {"text": "Одинаковый повтор идемпотентен; конфликт одинаковой ревизии и gap различимы, не скрыты."}, "A-03": {"text": "Отключение sink оставляет источник неполностью подтверждённым; replay не создаёт вторую переписку."}, "A-04": {"text": "Terminal update не теряется из-за coalescing; защитные лимиты измерены и описаны без фиктивного SLA."}}, "assignment": "Довести нормализацию уже реализованного IPC-потока, не сканируя полный длинный диалог на каждой правке.\n\nРабота:\n1. Первый snapshot индексирует известные history roots и item paths. Patch нормализует только dirty items; изменение контейнера инвалидирует только его поддерево.\n2. Неизвестная структурная правка даёт ограниченный rebuild нужного root и диагностику. Хранить ограниченный cache (revision, change hash): точный повтор без эффекта, другая правка на той же ревизии — resync.\n3. Объединять промежуточные текстовые ревизии в малом настраиваемом интервале; terminal flush немедленно. Текст не пересказывать моделью.\n4. Подтверждать source revision после всех необходимых записей/проекций/cursor в БД; ошибка sink не продвигает acknowledgement. Большой snapshot до финального барьера остаётся hydrating.\n\nОбласть изменений: waypoint/adapters/; waypoint/collector.py; tests/test_adapters.py.\n\nНе изменять: web assets.\n\nТочное чтение (пути от roadmap/):\n../waypoint/design/IMPLEMENTATION_MAP.md — раздел Required hardening; Recent-revision consistency\n../waypoint/waypoint/adapters/patches.py\n../waypoint/waypoint/adapters/codex.py\n../waypoint/waypoint/adapters/ipc.py\n../waypoint/waypoint/collector.py\n../waypoint/tests/test_adapters.py\n\nРежим MIXED. Предпочтительный исполнитель: CODEX. Исполнитель выбирает безопасный порядок внутри согласованного участка; назначение не сделано.", "layout": {"x": 80, "y": 650}, "parent": "WPT-C05", "source_refs": [{"label": "design/IMPLEMENTATION_MAP.md", "section": "Required hardening; Recent-revision consistency", "uri": "../waypoint/design/IMPLEMENTATION_MAP.md"}, {"label": "waypoint/adapters/patches.py", "uri": "../waypoint/waypoint/adapters/patches.py"}, {"label": "waypoint/adapters/codex.py", "uri": "../waypoint/waypoint/adapters/codex.py"}, {"label": "waypoint/adapters/ipc.py", "uri": "../waypoint/waypoint/adapters/ipc.py"}, {"label": "waypoint/collector.py", "uri": "../waypoint/waypoint/collector.py"}, {"label": "tests/test_adapters.py", "uri": "../waypoint/tests/test_adapters.py"}], "tests": {"T-01": {"evidence_level": "component + limited live", "invalidated_by": "Parser/index/coalescing/ack boundary.", "label": "Patch, cache, coalescing, commit", "procedure": "Локальный synthetic Unix peer: точные/конфликтующие повторы, gap, terminal flush и искусственный отказ sink; затем один естественный live patch."}}, "title": "Инкрементальный поток и durable receipt", "x_observability": {"intent": {"change": "Читать источник инкрементально и сохранять подтверждения доставки вместе с курсором.", "context": "Повторная доставка и перезапуск не должны терять или дублировать факты.", "summary": "Доставлять поток с восстановлением"}}, "x_roadmap": {"avoid_paths": ["web assets"], "eligible_alternative": null, "escalation": "", "kind": "stage", "owned_paths": ["waypoint/adapters/", "waypoint/collector.py", "tests/test_adapters.py"], "preferred_executor": "CODEX", "read_set": [{"label": "design/IMPLEMENTATION_MAP.md", "section": "Required hardening; Recent-revision consistency", "uri": "../waypoint/design/IMPLEMENTATION_MAP.md"}, {"label": "waypoint/adapters/patches.py", "uri": "../waypoint/waypoint/adapters/patches.py"}, {"label": "waypoint/adapters/codex.py", "uri": "../waypoint/waypoint/adapters/codex.py"}, {"label": "waypoint/adapters/ipc.py", "uri": "../waypoint/waypoint/adapters/ipc.py"}, {"lab     api.mountThemeSelector = select => {

        const active = themes.some(theme => theme.id === saved && theme.state === 'ready') ? saved : 'terracotta';
        select.replaceChildren();
        for (const theme of themes) { const option = document.createElement('option'); option.textContent = theme.label; option.value = theme.id || ''; option.disabled = theme.state !== 'ready'; select.append(option); }
        const apply = id => { document.documentElement.dataset.theme = id; select.value = id; try { localStorage.setItem('waypoint-theme', id); } catch {} };

<script>(() => {
    'use strict';
    const api = window.WaypointUI = window.WaypointUI || {};
    const el = (tag, cls, text) => { const node = document.createElement(tag); node.className = cls; if (text !== undefined) node.textContent = String(text); return node; };
    api.intentFor = node => node?.x_observability?.intent || null;
    api.nodeView = (view, id) => view.node_views?.[id] || {};
    api.activityText = projection => {
        const activity = projection.activity || projection.descendant_activity || projection.descendants || {};
        const active = activity.distinct_active_agents ?? activity.active_agents ?? activity.active_agent_count;
        const blocks = activity.distinct_active_leaves ?? activity.active_leaves ?? activity.active_blocks;
        return [active != null ? `${active} активных агентов внутри` : '', blocks != null ? `${blocks} активных конечных блоков` : ''].filter(Boolean).join(' · ');
    };
    api.reportedStatus = (view, id) => { const projection = api.nodeView(view, id); return projection.reported_status?.status ?? projection.reported_status ?? projection.status?.status ?? view.node_states?.find(state => state.id === id)?.status ?? 'Не указан'; };
    api.appendDependencies = (container, projection) => {
        const prerequisites = projection.prerequisites;
        if (!prerequisites) return;
        for (const phase of ['start', 'finish']) {
            const requirements = prerequisites[phase]; if (!requirements) continue;
            const section = el('details', 'prerequisites'); section.append(el('summary', '', phase === 'start' ? 'Для начала' : 'Для завершения'));
            const list = Array.isArray(requirements) ? requirements : requirements.requirements || requirements.items || [requirements];
            if (!list.length) section.append(el('p', 'small-note', 'Дополнительные требования отсутствуют'));
            const labels = {available:'доступно',satisfied:'доступно',waived:'требование снято',conflict:'противоречивые подтверждения',missing:'ещё не получено',unavailable:'недоступно',stale:'устарело',unknown:'доступность не подтверждена',not_required:'не требуется'};
            for (const requirement of list) {
                const record = el('div','dependency-record');
                const availability = requirement.availability || requirement.state || 'unknown';
                record.append(el('strong','', (requirement.producer_id || requirement.declared_target_id || 'Требование') + ' · ' + (labels[availability] || availability)));
                if (requirement.why) record.append(el('p','',requirement.why));
                if (requirement.inherited) record.append(el('small','small-note','Унаследовано от группы ' + (requirement.declared_target_id || '')));
                if (requirement.receipts?.length) record.append(el('p','small-note','Подтверждений: ' + requirement.receipts.length));
                if (requirement.stale_receipts?.length) record.append(el('p','small-note','Устаревших подтверждений: ' + requirement.stale_receipts.length));
                section.append(record);
            }
            container.append(section);
        }
    };
    api.mountPlan = (container, initialView, {onOpenNode, preferences = {}}) => {
        let current = initialView;
        const expanded = new Set(preferences.expanded || []);
        const render = view => {
            const top = container.scrollTop; current = view; container.replaceChildren();
            const plan = view.plan; container.append(el('h1', '', plan.title || 'План проекта'));
            if (view.purpose || view.project?.purpose || plan.x_observability?.purpose) container.append(el('p', 'project-purpose', view.purpose || view.project?.purpose || plan.x_observability.purpose));
            container.append(el('p', 'small-note version-observation', view.version !== view.current_version ? 'Текущие наблюдения поверх старой структуры плана. Историческое воспроизведение не выполняется.' : 'Сообщённые статусы и активность потомков показаны раздельно.'));
            const appendNode = (id, node, depth, seen) => {
                if (seen.has(id)) return; seen.add(id);
                const row = el('article', 'plan-row'); row.dataset.node = id; row.style.setProperty('--depth', Math.min(depth, 12));
                const open = el('button', 'plan-node-link', id + ' · ' + node.title); open.onclick = () => onOpenNode(id); row.append(open);
                const intent = api.nodeView(view,id).intent || api.intentFor(node); row.append(el('p', intent ? 'plan-intent' : 'small-note missing-intent', intent?.summary || 'Описание для владельца пока не заполнено'));
                row.append(el('p', 'plan-status', 'Сообщено: ' + api.reportedStatus(view, id)));
                const activity = api.activityText(api.nodeView(view, id)); if (activity) row.append(el('p', 'small-note descendant-activity', activity));
                if (intent) { const details = el('details', 'intent-details'); details.open = expanded.has(id); details.append(el('summary', '', 'Контекст и изменение')); for (const [label, field] of [['Зачем', 'context'], ['Что изменится', 'change'], ['Границы', 'scope']]) if (intent[field]) details.append(el('h4', '', label), el('p', 'prose', typeof intent[field] === 'string' ? intent[field] : JSON.stringify(intent[field]))); details.ontoggle = () => { if (details.open) expanded.add(id); else expanded.delete(id); preferences.expanded = [...expanded]; preferences.onChange?.(); }; row.append(details); }
                api.appendDependencies(row, api.nodeView(view, id)); container.append(row);
                for (const [childId, child] of Object.entries(plan.nodes)) if (child.parent === id) appendNode(childId, child, depth + 1, seen);
            };
            const seen = new Set(); for (const [id, node] of Object.entries(plan.nodes)) if (!node.parent || !plan.nodes[node.parent]) appendNode(id, node, 0, seen);
            for (const [id, node] of Object.entries(plan.nodes)) if (!seen.has(id)) appendNode(id, node, 0, seen);
            container.scrollTop = preferences.top ?? top;
        };
        container.onscroll = () => { preferences.top = container.scrollTop; preferences.onChange?.(); }; render(initialView);
        return {update: render, dispose() { preferences.top = container.scrollTop; preferences.expanded = [...expanded]; preferences.onChange?.(); container.onscroll = null; container.replaceChildren(); }};
    };
})();
</script>
<script>/* Per-reader category controls. An empty selection is deliberately distinct from all. */
(() => {
    'use strict';
    const api = window.WaypointUI = window.WaypointUI || {};
    const categories = {message:'Сообщения',explanation:'Пояснения',plan:'План',command:'Команды',tool:'Инструменты',change:'Изменения',test:'Проверки',agent:'Агенты',other:'Прочее'};
    api.bindTypeFilter = function (container, initialQuery = {}, {onChange} = {}) {
        let query = {...initialQuery};
        function notify() { onChange?.({...query, categories: query.categories == null ? null : [...query.categories]}); }
        function render() {
            container.replaceChildren(); const field = document.createElement('fieldset'); field.className = 'type-filter'; const legend = document.createElement('legend'); legend.textContent = 'Типы сообщений'; field.append(legend);
            for (const [label, selected] of [['Все', null], ['Ничего', []]]) { const button = document.createElement('button'); button.type = 'button'; button.textContent = label; button.onclick = () => { query.categories = selected; render(); notify(); }; field.append(button); }
            for (const [category, title] of Object.entries(categories)) { const label = document.createElement('label'); const input = document.createElement('input'); input.type = 'checkbox'; input.checked = query.categories == null || query.categories.includes(category); input.dataset.category = category; input.onchange = () => { const selection = new Set(query.categories == null ? Object.keys(categories) : query.categories); if (input.checked) selection.add(category); else selection.delete(category); query.categories = Object.keys(categories).filter(c => selection.has(c)); notify(); }; label.append(input, document.createTextNode(title)); field.append(label); }
            const errorLabel = document.createElement('label'); const error = document.createElement('input'); error.type = 'checkbox'; error.checked = !!query.only_errors; error.onchange = () => { query.only_errors = error.checked; notify(); }; errorLabel.append(error, document.createTextNode('Только ошибки')); field.append(errorLabel); container.append(field);
        }
        render(); return {update(nextQuery) { query = {...nextQuery}; render(); }, dispose() {container.replaceChildren();}};
    };
})();
</script>
<script>/* Curated algorithm records: DOM-only display, no source execution or file reads. */
(() => {

    const api = window.WaypointUI = window.WaypointUI || {};
    function element(tag, text, className) { const node = document.createElement(tag); if (text != null) node.textContent = String(text); if (className) node.className = className; return node; }
    function list(parent, label, values) { if (!values?.length) return; const section = element('section'); section.append(element('h4', label)); const ul = element('ul'); for (const value of values) ul.append(element('li', value)); section.append(ul); parent.append(section); }
    function reference(parent, ref, repository, revision) {
        const text = `${ref.path || ''}${ref.symbol ? ' · ' + ref.symbol : ''}${revision ? ' @ ' + revision : ''}`;

                else for (const [label,field] of [['Суть','summary'],['Зачем','context'],['Что изменится','change'],['Границы','scope']]) if (intent[field]) blockSection(body,label,typeof intent[field] === 'string' ? intent[field] : JSON.stringify(intent[field]));
                modules.appendDependencies(body, modules.nodeView(ui.state,id));
                return;
            }
            blockSection(body, 'Задание исполнителю', node.assignment);
            for (const r of node.source_refs || []) {
                body.append(el('h4', '', r.label || 'Источник'));
                if (/^https?:\/\//.test(r.uri || '')) {
                    const a = el('a', 'prose', r.uri);
                    a.href = r.uri;
                    a.rel = 'noreferrer noopener';
                    a.target = '_blank';
                    body.append(a);
                }
                else
                    body.append(el('div', 'prose', r.uri || ''));
            }
            const edgeEntries = Object.entries(ui.state.plan.edges).filter(([, e]) => e.to === id || e.from === id);
            if (edgeEntries.length)
                body.append(el('h4', '', 'Связи'));
            for (const [, e] of edgeEntries) {
                const other = e.to === id ? e.from : e.to;
                body.append(btn((e.to === id ? '← ' : '→ ') + other + ' · ' + nodeName(other), () => focusNode(other), 'related'));
            }
        }
        else if (tab === 'algorithms') {
            const requested = context();
            try { const view = demo ? {algorithms: []} : await api(base() + '/algorithms?' + new URLSearchParams({node:id,deep:'false',version:ui.state.version}));
                if (!matches(requested) || ui.inspector !== state || view.basis?.plan_version && view.basis.plan_version !== ui.state.version) return;
                state.algorithmMount = modules.mountAlgorithms(body, view, {onOpenNode: target => {setView('map');focusNode(target);openInspector('node',target,'task');}, onOpenAlgorithm: algorithm => openAlgorithm(algorithm)});
            } catch(e) { if (e.name !== 'AbortError' && ui.inspector === state) body.append(el('p','source-warning',e.message)); }
        }
        else if (tab === 'acceptance') {
            body.append(el('h4', '', 'Ожидалось'));
            for (const [aid, a] of Object.entries(node.acceptance || {})) {
                const row = el('div', 'criterion');
                row.append(el('b', '', aid), el('span', '', a.text || a.label || ''));
                body.append(row);
            }
            body.append(el('h4', '', 'Получено'), el('div', 'result-block', status.result?.summary || 'Результат ещё не описан'));
            body.append(el('h4', '', 'Расхождения с ожиданиями'), el('div', 'result-block', status.result?.difference || 'Не указаны. Это не доказательство отсутствия расхождений.'));
            if (status.result?.plan_version)
                body.append(el('div', 'result-tag', 'Результат относительно ' + status.result.plan_version));
        }
        else if (tab === 'tests') {
            for (const [tid, t] of Object.entries(node.tests || {})) {
                const check = ui.state.checks.find(c => c.node_id === id && c.test_id === tid);
                const row = el('div', 'checkline'), text = el('div');
                text.append(el('div', '', t.label || tid), el('small', '', `${tid} · ${check?.outcome || 'не запускался'} · ${check?.freshness === 'current' ? 'актуальность заявлена исполнителем' : 'актуальность не подтверждена'}`));
                row.append(lamp(check), text);
                body.append(row);
            }
            body.append(el('p', 'small-note', 'Успешные тесты, актуальность результата и статус задачи — отдельные сведения. Карта не меняет статус исполнителя.'));
        }
        else if (tab === 'status') {
            blockSection(body, 'Сообщённый статус', status.status || 'Не указан');
            const activity = modules.activityText(modules.nodeView(ui.state,id)); if (activity) blockSection(body, 'Потомки', activity);
            modules.appendDependencies(body, modules.nodeView(ui.state,id));
            blockSection(body, 'Пояснение', status.explanation || 'Не указано');
            blockSection(body, 'Последнее сообщение о статусе', status.at || 'Нет');
            for (const a of workActors(id))
                body.append(btn(agentName(a.id) + ' · ' + a.activity, () => openInspector('agent', a.id, 'messages'), 'related'));
        }
        if (Object.values(ui.state.plan.nodes).some(n => n.parent === id))
            body.append(btn('Открыть внутренний граф ↘', () => enter(id), 'more'));
        body.append(btn('Копировать адрес блока', async () => { const link = location.origin + location.pathname + '#project=' + encodeURIComponent(ui.project) + '&scope=' + encodeURIComponent(node.parent || '') + '&node=' + encodeURIComponent(id); try {
            await navigator.clipboard.writeText(link);
            notice('Адрес скопирован');
        }
        catch {
            notice('Блок: ' + id);
        } }, 'more'));
    }
    $('#diff').onclick = async () => { const requested = context(); const index = ui.versions.findIndex(v => v.version === ui.state.version), previous = ui.versions[index + 1]; if (!previous)
        return notice('Предыдущей версии нет'); openInspector('diff', null, 'diff'); $('#inspector-title').textContent = 'Изменения плана'; const body = $('#inspector-body'); body.replaceChildren(); try {
        let changes;
        if (demo) {
            const before = demo.states[previous.version].plan, after = ui.state.plan;
            changes = objectDiff(before, after);
        }
        else
            changes = (await api(base() + '/diff?' + new URLSearchParams({ before: previous.version, after: ui.state.version }))).changes;
        if (!matches(requested) || ui.inspector?.kind !== 'diff') return;
        for (const c of changes) {
            const row = el('div', 'diff-row');
            row.append(el('code', '', c.op + ' · ' + c.path.join('/')));
            if (c.before !== undefined)
                row.append(el('pre', '', '− ' + JSON.stringify(c.before)));
            if (c.after !== undefined)
                row.append(el('pre', '', '+ ' + JSON.stringify(c.after)));
            body.append(row);
        }
        if (!changes.length)
            body.append(el('p', '', 'Структура не менялась'));
    }
    catch (e) {
        if (e.name !== 'AbortError') notice(e.message);
    } };
    function objectDiff(a, b, path = []) { if (JSON.stringify(a) === JSON.stringify(b))
        return []; if (a && b && !Array.isArray(a) && !Array.isArray(b) && typeof a === 'object' && typeof b === 'object') {
        return [...new Set([...Object.keys(a), ...Object.keys(b)])].flatMap(k => objectDiff(a[k], b[k], [...path, k]));
    } return [{ path, op: a === undefined ? 'add' : b === undefined ? 'remove' : 'replace', before: a, after: b }]; }
    function disposeProjectViews() { planMount?.dispose(); planMount = null; algorithmsMount?.dispose(); algorithmsMount = null; }
    async function openAlgorithm(id) {
        const requested = context(); const body = $('#inspector-body');
        closeInspector(); $('#inspector').hidden = false; $('#inspector-id').textContent = id; $('#inspector-title').textContent = 'Алгоритм'; $('#tabs').replaceChildren(); body.replaceChildren();
        const selection = {kind:'algorithm',id,signature:inspectorSignature('algorithm',id)}; ui.inspector = selection;
        try { const result = await api(base() + '/algorithms/' + encodeURIComponent(id) + '?' + new URLSearchParams({version:ui.state.version}));
            if (!matches(requested) || ui.inspector !== selection) return;
            const algorithms = result.algorithms || [result.algorithm || result];
            selection.algorithmMount = modules.mountAlgorithms(body, {algorithms,basis:result.basis}, {onOpenNode: target => {setView('map');focusNode(target);openInspector('node',target,'task');},onOpenAlgorithm:()=>{}});
        } catch(e) { if (e.name !== 'AbortError' && ui.inspector === selection) body.append(el('p','source-warning',e.message)); }
    }
    async function renderAlgorithms() {
        if (!ui.state || ui.view !== 'algorithms') return;
        const requested = context();
        try { const result = demo ? {algorithms: []} : await api(base() + '/algorithms?' + new URLSearchParams({version:ui.state.version}));
            if (!matches(requested) || ui.view !== 'algorithms' || result.basis?.plan_version && result.basis.plan_version !== ui.state.version) return;
            if (algorithmsMount) algorithmsMount.update(result);
            else algorithmsMount = modules.mountAlgorithms($('#algorithms-view'), result, {onOpenAlgorithm:openAlgorithm,onOpenNode:id=>{setView('map');focusNode(id);openInspector('node',id,'task');}});
        } catch(e) { if (e.name !== 'AbortError') notice(e.message); }
    }
    function renderPlan() {
        if (!ui.state || ui.view !== 'plan') return;
        if (planMount) planMount.update(ui.state);
        else { const prefs = preferences('plan'); prefs.onChange = () => savePreferences('plan',prefs); planMount = modules.mountPlan($('#plan-view'),ui.state,{onOpenNode:id=>{setView('map');focusNode(id);openInspector('node',id,'task');},preferences:prefs}); }
    }
    function setView(view) {
        if (ui.view === 'map') saveMap();
        ui.view = view;
        if (view !== 'plan' && planMount) { planMount.dispose(); planMount = null; }
        if (view !== 'algorithms' && algorithmsMount) { algorithmsMount.dispose(); algorithmsMount = null; }
        $('#projects-view').hidden = view !== 'projects'; $('#plan-view').hidden = view !== 'plan'; $('#algorithms-view').hidden = view !== 'algorithms'; $('#viewport').hidden = view !== 'map';
        $('.agents-bar').hidden = view === 'projects'; $('.orchestrators').hidden = view === 'projects'; $('.toolbar').hidden = view === 'projects';
        for (const button of $('#project-views').children) button.classList.toggle('current',button.dataset.view === view);
        for (const id of ['crumbs','up','fit','minus','zoom','plus','full']) $('#'+id).hidden = view !== 'map';
        $('.project-title').textContent = view === 'projects' ? 'Проекты' : ui.summaries.find(p=>p.project_id===ui.project)?.title || 'Waypoint';
        if (view === 'projects') { closeInspector(); catalogueDispose?.(); catalogueDispose = modules.mountProjectCatalogue($('#projects-view'),ui.summaries,{onOpenProject:openProject}); $('#summary').textContent = ui.summaries.length + ' проектов'; }
        else { savePreferences('navigation',{view}); renderMap(); renderPlan(); if (view === 'algorithms') renderAlgorithms(); }
    }
    async function loadCatalogue() {
        const demoPlan = demo?.states?.[demo.current]?.plan;
        const result = demo ? demo.projects || [{project_id:demoPlan.project_id,title:demoPlan.title,purpose:demoPlan.x_observability?.purpose || demoPlan.description || 'Вымышленный проект для знакомства с Waypoint',source_health:'fictional'}] : await api('/api/projects?summary=true');
        ui.summaries = Array.isArray(result) ? result : result.projects || [];
        $('#project').replaceChildren(el('option','','Выбрать проект…'));
        $('#project').firstChild.value = '';
        for (const project of ui.summaries) { const option = el('option','',project.title); option.value = project.project_id; $('#project').append(option); }
    }
    async function showProjects(writeHash = true) {
        saveMap(); disposeProjectViews(); cancelNavigation(); closeInspector(); for (const reader of readers.values()) detachReader(reader); readers.clear(); ui.state = null; $('#nodes').replaceChildren(); $('#project').value = ''; setView('projects');
        if (writeHash) history.pushState(null,'',location.pathname + location.search);
        try { await loadCatalogue(); setView('projects'); } catch(e) { if(e.name!=='AbortError')notice(e.message); }
    }
    async function openProject(project, {fromHash=false}={}) {
        saveMap(); disposeProjectViews(); cancelNavigation(); closeInspector(); for (const reader of readers.values()) detachReader(reader); readers.clear(); $('#nodes').replaceChildren();
        ui.project = project; ui.cursor = 0; ui.version = null; ui.state = null; restoreMap(); ui.selected = ui.actor = null; $('#project').value = project;
        const selectedView = preferences('navigation').view || 'map'; setView(['map','plan','algorithms'].includes(selectedView) ? selectedView : 'map');
        if (!fromHash) history.pushState(null,'','#project='+encodeURIComponent(project));
        await refresh(true);
    }
    $('#home').onclick = () => showProjects();
    for (const button of $('#project-views').children) button.onclick = () => setView(button.dataset.view);
    $('#version').onchange = async e => { saveMap(); disposeProjectViews(); cancelNavigation(); closeInspector(); ui.version = e.target.value; restoreMap(); for (const reader of readers.values()) detachReader(reader); readers.clear(); $('#nodes').replaceChildren(); await refresh(true); };
    $('#project').onchange = e => e.target.value ? openProject(e.target.value) : showProjects();
    async function refresh(includeVersions = false, events = null) {
        if (ui.busy || ui.view === 'projects') return;
        const requested = context(), sequence = ++refreshSequence; ui.busy = true;
        try {
            const state = demo ? demo.states[ui.version || demo.current] : await api(base() + '/state' + (ui.version ? '?version=' + encodeURIComponent(ui.version) : ''));
            const versions = demo ? demo.versions : includeVersions ? await api(base() + '/versions') : ui.versions;
            if (!matches(requested)) return;
            const previousState = ui.state; ui.versions = versions; ui.state = state;
            invalidateReaders(events && (state.cursor || 0) <= ui.cursor ? events : null, previousState);
            ui.cursor = Math.max(ui.cursor,state.cursor || 0);
            if (ui.scope && !state.plan.nodes[ui.scope]) { ui.scope = null; notice('Этот блок отсутствует в выбранной версии. История сохранена.'); }
            renderToolbar(); renderActors(); renderMap(); renderPlan(); if(ui.view === 'algorithms') renderAlgorithms();
            online = true; $('#foot-status').classList.remove('source-warning');
            $('#foot-status').textContent = demo || ui.project === 'demo' ? demo?.notice || 'Демо · вымышленные события' : 'Локальный сервис · тексты не отправляются в облако'; refreshInspectorDetails();
        } catch(e) { if (e.name !== 'AbortError' && matches(requested)) { online = false; $('#foot-status').textContent = 'Нет связи · показаны последние полученные данные'; $('#foot-status').classList.add('source-warning'); notice(e.message); } }
        finally { if (sequence === refreshSequence && matches(requested)) ui.busy = false; }
    }
    async function watch() {
        while (!stopped && !demo) {
            if (ui.view === 'projects' || !ui.state) { await new Promise(resolve=>setTimeout(resolve,500)); continue; }
            const requested = context();
            try { const reply = await api(base() + '/events?' + new URLSearchParams({after:ui.cursor,wait:12,limit:200}));
                if (!matches(requested)) continue;
                if (reply.events.length) { ui.cursor = reply.cursor; await refresh(reply.events.some(event=>event.kind==='plan.changed'),reply.events); }
                else if (!online) await refresh(true);
            } catch(e) { if (e.name==='AbortError' || !matches(requested)) continue; online=false; $('#foot-status').textContent='Связь прервана · исполнители не остановлены'; $('#foot-status').classList.add('source-warning'); await new Promise(resolve=>setTimeout(resolve,1800)); }
        }
    }
    async function boot() {
        try { await loadCatalogue(); $('#connection').textContent = demo ? demo.label || 'Демо' : 'Локально'; $('#connection').classList.toggle('demo',!!demo);
            const hash = new URLSearchParams(location.hash.slice(1)); const project = hash.get('project');
            if(project && ui.summaries.some(summary=>summary.project_id===project)) { await openProject(project,{fromHash:true}); if(hash.get('scope')) enter(hash.get('scope'),false); if(hash.get('node')) {setView('map');focusNode(hash.get('node'));openInspector('node',hash.get('node'),'task');} }
            else setView('projects'); watch();
        } catch(e) { $('#projects-view').hidden=false; $('#projects-view').textContent='Откройте локальный адрес из команды wp url. Ключ доступа хранится только в этой вкладке.'; $('#foot-status').textContent=e.message; }
    }
    window.addEventListener('popstate',async()=>{ const hash=new URLSearchParams(location.hash.slice(1)); const project=hash.get('project'); if(!project) {await showProjects(false);return;} if(project!==ui.project||!ui.state) await openProject(project,{fromHash:true}); if(!ui.state)return;setView('map');enter(hash.get('scope')||null,false);if(hash.get('node'))focusNode(hash.get('node')); });
    window.addEventListener('resize', () => renderMap());
    window.addEventListener('beforeunload', () => { saveMap(); stopped = true; navigationController.abort(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape')
        closeInspector(); if (e.altKey && e.key === 'ArrowUp' && ui.scope) {
        e.preventDefault();
        enter(ui.state.plan.nodes[ui.scope]?.parent || null);
    } });
    // Developer diagnostic is read-only and does not expose credentials.
    window.waypointView = () => ({ view:ui.view, basis:ui.state?.basis, generation:navigationGeneration, scope: ui.scope, camera: { ...ui.camera }, visibleNodes: document.querySelectorAll('.node').length, version: ui.state?.version, project: ui.project });
    boot();
})();
